<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Sertifikat — Ujian Kenaikan Tingkat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --panel:#1b1f27;
    --panel-2:#20242e;
    --border:#2b303b;
    --text:#eee9df;
    --text-dim:#8d94a1;
    --red:#b3202b;
    --gold:#c9a24d;
    --c4:#3f9463;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(179,32,43,0.15), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding-bottom:60px;
  }
  header{
    padding:36px 20px 24px;
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, rgba(201,162,77,0.04) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(34px,7vw,50px);
    letter-spacing:.03em;
    margin:0 0 6px;
    line-height:.95;
  }
  header p{ color:var(--text-dim); margin:0; max-width:560px; font-size:14px; }

  main{
    max-width:1280px;
    margin:0 auto;
    padding:24px 16px 0;
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:880px){
    main{ grid-template-columns:1fr; }
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
  }

  label{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.04em;
  }
  input, select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{ outline:none; border-color:var(--gold); }

  .sync-note{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin:10px 0 4px;
  }
  .sync-note.ok{color:var(--c4);}
  .sync-note.err{color:#d64545;}

  .name-list{
    margin-top:12px;
    max-height:520px;
    overflow-y:auto;
    border-top:1px dashed var(--border);
    padding-top:8px;
  }
  .name-item{
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    margin-bottom:4px;
    border:1px solid transparent;
  }
  .name-item .meta{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim);
    font-weight:400;
    margin-top:2px;
  }
  .name-item:hover{ background:var(--panel-2); }
  .name-item.active{
    background:rgba(201,162,77,0.12);
    border-color:var(--gold);
  }
  .list-empty{
    color:var(--text-dim);
    font-size:13px;
    padding:16px 4px;
    text-align:center;
  }

  .manual-field{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--border);
  }

  .preview-wrap{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
  }
  .canvas-outer{
    width:100%;
    overflow:auto;
    border-radius:8px;
    background:#0d0f13;
    display:flex;
    justify-content:center;
    padding:10px;
  }
  #cert-canvas{
    width:100%;
    max-width:1000px;
    height:auto;
    border-radius:4px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }

  .preview-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .btn{
    background:linear-gradient(135deg, var(--red), #8a1620);
    color:#fff;
    border:none;
    padding:13px 20px;
    border-radius:10px;
    font-family:'Bebas Neue',sans-serif;
    font-size:18px;
    letter-spacing:.05em;
    cursor:pointer;
  }
  .btn:disabled{
    background:#2b303b;
    color:var(--text-dim);
    cursor:not-allowed;
  }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:13px 18px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-secondary:hover{ color:var(--text); border-color:var(--text-dim); }

  .selected-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--gold);
    margin-bottom:2px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Panel Pelatih · Cetak Sertifikat</div>
  <h1>CETAK SERTIFIKAT KELULUSAN</h1>
  <p>Pilih nama atlet dari daftar, nama otomatis ditulis pada sertifikat, lalu unduh sebagai gambar PNG siap cetak.</p>
</header>

<main>
  <div class="card">
    <label>Cari Nama Atlet</label>
    <input id="q-search" type="text" placeholder="Ketik nama…">
    <div id="sync-status" class="sync-note">Menghubungkan ke Firebase…</div>
    <div class="name-list" id="name-list">
      <div class="list-empty">Memuat data...</div>
    </div>

    <div class="manual-field">
      <label>Atau Ketik Nama Manual</label>
      <input id="manual-name" type="text" placeholder="Tulis nama jika tidak ada di daftar">
    </div>
  </div>

  <div class="preview-wrap">
    <div class="selected-tag" id="selected-tag">Belum ada nama dipilih</div>
    <div class="canvas-outer">
      <canvas id="cert-canvas"></canvas>
    </div>
    <div class="preview-actions">
      <button class="btn" id="btn-download" disabled>UNDUH SEBAGAI PNG</button>
      <button class="btn-secondary" id="btn-clear">Kosongkan Nama</button>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPI3JDgJCmTomJ8muev2ld39POwEdsVwk",
  authDomain: "tesp-529b8.firebaseapp.com",
  databaseURL: "https://tesp-529b8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tesp-529b8",
  storageBucket: "tesp-529b8.firebasestorage.app",
  messagingSenderId: "586985292162",
  appId: "1:586985292162:web:84a01d8724c25f98ef8f9b",
  measurementId: "G-XF0N4NFY0T"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const rosterRef = ref(db, 'uji_fisik');

let allEntries = [];
let currentName = '';

function setSyncStatus(msg, cls){
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-note' + (cls ? ' '+cls : '');
}

onValue(rosterRef, (snapshot) => {
  const data = snapshot.val() || {};
  allEntries = Object.keys(data).map(id => ({...data[id], id}));
  allEntries.sort((a,b)=> (a.nama||'').localeCompare(b.nama||''));
  setSyncStatus('Tersinkron dengan Firebase · ' + allEntries.length + ' atlet', 'ok');
  renderNameList();
}, (err) => {
  console.error(err);
  setSyncStatus('Gagal terhubung ke Firebase.', 'err');
});

document.getElementById('q-search').addEventListener('input', renderNameList);

function renderNameList(){
  const q = document.getElementById('q-search').value.trim().toLowerCase();
  const wrap = document.getElementById('name-list');
  const filtered = allEntries.filter(e => !q || (e.nama||'').toLowerCase().includes(q));

  if(filtered.length === 0){
    wrap.innerHTML = '<div class="list-empty">Tidak ada nama yang cocok.</div>';
    return;
  }

  wrap.innerHTML = '';
  filtered.forEach(e=>{
    const item = document.createElement('div');
    item.className = 'name-item' + (currentName === e.nama ? ' active' : '');
    item.innerHTML = `
      ${e.nama}
      <div class="meta">${e.usia||'-'} th · ${e.jk==='L'?'Laki-laki':'Perempuan'} · ${e.ageGroup||'-'}</div>
    `;
    item.addEventListener('click', ()=>{
      document.getElementById('manual-name').value = '';
      setCurrentName(e.nama);
    });
    wrap.appendChild(item);
  });
}

document.getElementById('manual-name').addEventListener('input', (ev)=>{
  setCurrentName(ev.target.value);
});

document.getElementById('btn-clear').addEventListener('click', ()=>{
  document.getElementById('manual-name').value = '';
  setCurrentName('');
});

function setCurrentName(name){
  currentName = name || '';
  document.getElementById('selected-tag').textContent = currentName
    ? 'Nama terpilih: ' + currentName
    : 'Belum ada nama dipilih';
  document.getElementById('btn-download').disabled = !currentName;
  renderNameList();
  drawCertificate();
}

// ---------- Canvas sertifikat ----------
const canvas = document.getElementById('cert-canvas');
const ctx = canvas.getContext('2d');
const baseImg = new Image();
let imgLoaded = false;

baseImg.onload = ()=>{
  canvas.width = baseImg.naturalWidth;
  canvas.height = baseImg.naturalHeight;
  imgLoaded = true;
  drawCertificate();
};

  let fontSize = NAME_AREA.baseFontSize;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  do{
    ctx.font = `italic 700 ${fontSize}px "Playfair Display", serif`;
    const width = ctx.measureText(currentName).width;
    if(width <= NAME_AREA.maxWidth) break;
    fontSize -= 2;
  } while(fontSize > 28);

  ctx.font = `italic 700 ${fontSize}px "Playfair Display", serif`;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText(currentName, NAME_AREA.centerX, NAME_AREA.centerY);
}

document.getElementById('btn-download').addEventListener('click', ()=>{
  if(!currentName) return;
  const safeName = currentName.trim().replace(/\s+/g,'_').replace(/[^\w\-]/g,'');
  const link = document.createElement('a');
  link.download = `Sertifikat_${safeName || 'Atlet'}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>

</body>
</html>

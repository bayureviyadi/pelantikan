<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Uji Fisik — Pencarian Atlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --panel:#1b1f27;
    --panel-2:#20242e;
    --border:#2b303b;
    --text:#eee9df;
    --text-dim:#8d94a1;
    --red:#b3202b;
    --gold:#c9a24d;
    --c0:#d64545;
    --c1:#e08a3c;
    --c2:#d9b54a;
    --c3:#7fb069;
    --c4:#3f9463;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(179,32,43,0.15), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding-bottom:60px;
  }
  header{
    padding:36px 20px 24px;
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, rgba(201,162,77,0.04) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(38px,8vw,58px);
    letter-spacing:.03em;
    margin:0 0 6px;
    line-height:.95;
  }
  header p{ color:var(--text-dim); margin:0; max-width:480px; font-size:14px; }
  main{ max-width:820px; margin:0 auto; padding:24px 16px 0; }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
  }

  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }
  .search-row input[type="text"]{
    flex:1;
  }
  input, select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{ outline:none; border-color:var(--gold); }
  .filters{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  @media (max-width:560px){
    .filters{grid-template-columns:1fr 1fr;}
  }
  label{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.04em;
  }

  .sync-note{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .sync-note.ok{color:var(--c4);}
  .sync-note.err{color:var(--c0);}

  .result-count{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    margin:14px 2px 10px;
  }

  .athlete-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .athlete-card:hover{ border-color:var(--gold); }
  .athlete-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }
  .athlete-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;
    letter-spacing:.02em;
    line-height:1;
  }
  .athlete-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-top:6px;
  }
  .overall-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:6px 12px;
    border-radius:8px;
    font-weight:700;
    letter-spacing:.05em;
    white-space:nowrap;
    align-self:flex-start;
  }

  .detail{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--border);
  }
  .detail.open{ display:block; }
  .test-row{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    background:var(--panel-2);
  }
  .test-row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .test-row-top .tname{font-weight:600; font-size:13px;}
  .test-row-top .tval{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .gauge{ display:flex; gap:4px; }
  .gauge .seg{ flex:1; height:7px; border-radius:3px; background:#2b303b; }
  .gauge .seg.on{ background:var(--seg-color, var(--gold)); }
  .cat-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    margin-top:6px;
    letter-spacing:.04em;
    font-weight:600;
  }
  .empty-note{ color:var(--text-dim); font-size:12px; font-style:italic; }

  .subhead{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin:14px 0 8px;
    padding-top:10px;
    border-top:1px dashed var(--border);
  }

  .roster-empty{
    color:var(--text-dim);
    font-size:13px;
    padding:20px 0;
    text-align:center;
  }

  .del{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    cursor:pointer;
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    padding:6px 10px;
    border-radius:6px;
    margin-top:12px;
  }
  .del:hover{ color:var(--red); border-color:var(--red); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Panel Pelatih · Basis Data Firebase</div>
  <h1>HASIL UJI FISIK</h1>
  <p>Cari dan tinjau hasil uji fisik atlet yang tersimpan secara realtime.</p>
</header>

<main>
  <div class="card">
    <div class="search-row">
      <input id="q-search" type="text" placeholder="Cari nama atlet…">
    </div>
    <div class="filters">
      <div class="field">
        <label>Jenis Kelamin</label>
        <select id="q-jk">
          <option value="">Semua</option>
          <option value="L">Laki-laki</option>
          <option value="P">Perempuan</option>
        </select>
      </div>
      <div class="field">
        <label>Kelompok Usia</label>
        <select id="q-usia">
          <option value="">Semua</option>
          <option value="6-8">6–8</option>
          <option value="9-11">9–11</option>
          <option value="12-14">12–14</option>
          <option value="15-17">15–17</option>
          <option value="18-25">18–25</option>
        </select>
      </div>
      <div class="field">
        <label>Kategori</label>
        <select id="q-cat">
          <option value="">Semua</option>
          <option value="0">Sangat Kurang</option>
          <option value="1">Kurang</option>
          <option value="2">Cukup</option>
          <option value="3">Baik</option>
          <option value="4">Baik Sekali</option>
        </select>
      </div>
    </div>
    <div id="sync-status" class="sync-note" style="margin-top:12px;">Menghubungkan ke Firebase…</div>
  </div>

  <div class="result-count" id="result-count"></div>
  <div id="list-wrap">
    <div class="roster-empty">Memuat data...</div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPI3JDgJCmTomJ8muev2ld39POwEdsVwk",
  authDomain: "tesp-529b8.firebaseapp.com",
  databaseURL: "https://tesp-529b8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tesp-529b8",
  storageBucket: "tesp-529b8.firebasestorage.app",
  messagingSenderId: "586985292162",
  appId: "1:586985292162:web:84a01d8724c25f98ef8f9b",
  measurementId: "G-XF0N4NFY0T"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const rosterRef = ref(db, 'uji_fisik');

const CATS = ["Sangat Kurang","Kurang","Cukup","Baik","Baik Sekali"];
const CAT_COLORS = ["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)"];

let allEntries = [];
let openId = null;

function setSyncStatus(msg, cls){
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-note' + (cls ? ' '+cls : '');
}

onValue(rosterRef, (snapshot) => {
  const data = snapshot.val() || {};
  allEntries = Object.keys(data).map(id => ({...data[id], id}));
  allEntries.sort((a,b)=> (b.tanggal||'').localeCompare(a.tanggal||''));
  setSyncStatus('Tersinkron dengan Firebase · ' + allEntries.length + ' atlet', 'ok');
  applyFilters();
}, (err) => {
  console.error(err);
  setSyncStatus('Gagal terhubung ke Firebase.', 'err');
});

function applyFilters(){
  const q = document.getElementById('q-search').value.trim().toLowerCase();
  const jk = document.getElementById('q-jk').value;
  const usia = document.getElementById('q-usia').value;
  const cat = document.getElementById('q-cat').value;

  const filtered = allEntries.filter(e=>{
    if(q && !(e.nama||'').toLowerCase().includes(q)) return false;
    if(jk && e.jk !== jk) return false;
    if(usia && e.ageGroup !== usia) return false;
    if(cat !== '' && String(e.overallIdx) !== cat) return false;
    return true;
  });

  document.getElementById('result-count').textContent =
    filtered.length + ' dari ' + allEntries.length + ' atlet ditemukan';

  renderList(filtered);
}

['input','change'].forEach(evt=>{
  document.getElementById('q-search').addEventListener(evt, applyFilters);
  document.getElementById('q-jk').addEventListener(evt, applyFilters);
  document.getElementById('q-usia').addEventListener(evt, applyFilters);
  document.getElementById('q-cat').addEventListener(evt, applyFilters);
});

function renderList(entries){
  const wrap = document.getElementById('list-wrap');
  if(entries.length===0){
    wrap.innerHTML = '<div class="roster-empty">Tidak ada atlet yang cocok dengan pencarian.</div>';
    return;
  }
  wrap.innerHTML = '';
  entries.forEach(e=>{
    const card = document.createElement('div');
    card.className = 'athlete-card';

    const badge = e.overallIdx!==null && e.overallIdx!==undefined
      ? `<span class="overall-badge" style="background:${CAT_COLORS[e.overallIdx]};color:#12151a;">${CATS[e.overallIdx].toUpperCase()}</span>`
      : `<span class="overall-badge" style="background:#2b303b;color:var(--text-dim);">BELUM ADA DATA</span>`;

    card.innerHTML = `
      <div class="athlete-top">
        <div>
          <div class="athlete-name">${e.nama}</div>
          <div class="athlete-meta">${e.usia} th · ${e.jk==='L'?'Laki-laki':'Perempuan'} · kelompok usia ${e.ageGroup||'-'} · ${e.tanggal||'-'}</div>
        </div>
        ${badge}
      </div>
      <div class="detail" id="detail-${e.id}"></div>
    `;

    card.addEventListener('click', (ev)=>{
      if(ev.target.closest('.del')) return;
      toggleDetail(e);
    });

    wrap.appendChild(card);

    if(openId === e.id){
      renderDetail(e);
    }
  });
}

function toggleDetail(e){
  openId = (openId === e.id) ? null : e.id;
  applyFilters();
}

function renderTestRow(row){
  if(!row.filled){
    return `
      <div class="test-row">
        <div class="test-row-top">
          <span class="tname">${row.label}</span>
          <span class="empty-note">tidak diisi</span>
        </div>
      </div>`;
  }
  let segs = '';
  for(let i=0;i<5;i++){
    segs += `<div class="seg${i<=row.catIdx?' on':''}" style="--seg-color:${CAT_COLORS[row.catIdx]}"></div>`;
  }
  return `
    <div class="test-row">
      <div class="test-row-top">
        <span class="tname">${row.label}</span>
        <span class="tval">${row.val} ${row.unit||''}</span>
      </div>
      <div class="gauge">${segs}</div>
      <div class="cat-label" style="color:${CAT_COLORS[row.catIdx]}">${CATS[row.catIdx]}</div>
    </div>`;
}

function renderDetail(e){
  const detail = document.getElementById('detail-'+e.id);
  if(!detail) return;
  detail.classList.add('open');

  const EXTRA_KEYS = ['hafalan','patahan'];
  const rows = e.rows||[];
  const physicalRows = rows.filter(r=>!EXTRA_KEYS.includes(r.key));
  const extraRows = rows.filter(r=>EXTRA_KEYS.includes(r.key));

  let html = '';
  physicalRows.forEach(row=>{ html += renderTestRow(row); });

  if(extraRows.length){
    html += `<div class="subhead">Tes Keagamaan &amp; Ketahanan</div>`;
    extraRows.forEach(row=>{ html += renderTestRow(row); });
  }

  html += `<button class="del" data-id="${e.id}">Hapus Data Atlet Ini</button>`;
  detail.innerHTML = html;

  detail.querySelector('.del').addEventListener('click', async (ev)=>{
    ev.stopPropagation();
    if(!confirm('Hapus data atlet ' + e.nama + '?')) return;
    try{
      await remove(ref(db, 'uji_fisik/'+e.id));
    }catch(err){
      console.error(err);
      alert('Gagal menghapus data.');
    }
  });
}
</script>

</body>
</html>

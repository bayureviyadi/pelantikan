<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Uji Fisik — Pencarian Atlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --panel:#1b1f27;
    --panel-2:#20242e;
    --border:#2b303b;
    --text:#eee9df;
    --text-dim:#8d94a1;
    --red:#b3202b;
    --gold:#c9a24d;
    --c0:#d64545;
    --c1:#e08a3c;
    --c2:#d9b54a;
    --c3:#7fb069;
    --c4:#3f9463;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(179,32,43,0.15), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding-bottom:60px;
  }
  header{
    padding:36px 20px 24px;
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, rgba(201,162,77,0.04) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(38px,8vw,58px);
    letter-spacing:.03em;
    margin:0 0 6px;
    line-height:.95;
  }
  header p{ color:var(--text-dim); margin:0; max-width:480px; font-size:14px; }
  main{ max-width:820px; margin:0 auto; padding:24px 16px 0; }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
  }

  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }
  .search-row input[type="text"]{
    flex:1;
  }
  input, select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{ outline:none; border-color:var(--gold); }
  .filters{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  @media (max-width:560px){
    .filters{grid-template-columns:1fr 1fr;}
  }
  label{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.04em;
  }

  .sync-note{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .sync-note.ok{color:var(--c4);}
  .sync-note.err{color:var(--c0);}

  .result-count{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    margin:14px 2px 10px;
  }

  .athlete-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .athlete-card:hover{ border-color:var(--gold); }
  .athlete-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }
  .athlete-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;
    letter-spacing:.02em;
    line-height:1;
  }
  .athlete-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-top:6px;
  }
  .overall-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:6px 12px;
    border-radius:8px;
    font-weight:700;
    letter-spacing:.05em;
    white-space:nowrap;
    align-self:flex-start;
  }

  .detail{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--border);
  }
  .detail.open{ display:block; }
  .test-row{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    background:var(--panel-2);
  }
  .test-row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .test-row-top .tname{font-weight:600; font-size:13px;}
  .test-row-top .tval{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .gauge{ display:flex; gap:4px; }
  .gauge .seg{ flex:1; height:7px; border-radius:3px; background:#2b303b; }
  .gauge .seg.on{ background:var(--seg-color, var(--gold)); }
  .cat-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    margin-top:6px;
    letter-spacing:.04em;
    font-weight:600;
  }
  .empty-note{ color:var(--text-dim); font-size:12px; font-style:italic; }

  .subhead{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin:14px 0 8px;
    padding-top:10px;
    border-top:1px dashed var(--border);
  }

  .roster-empty{
    color:var(--text-dim);
    font-size:13px;
    padding:20px 0;
    text-align:center;
  }

  .action-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .del, .edit-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    cursor:pointer;
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    padding:6px 10px;
    border-radius:6px;
  }
  .del:hover{ color:var(--red); border-color:var(--red); }
  .edit-btn:hover{ color:var(--gold); border-color:var(--gold); }

  .edit-form{ margin-top:4px; }
  .edit-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:10px;
    margin-bottom:12px;
  }
  .test-edit-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:6px;
  }
  @media (max-width:560px){
    .edit-grid{ grid-template-columns:1fr 1fr; }
    .test-edit-grid{ grid-template-columns:1fr; }
  }
  .edit-field{ margin-bottom:0; }
  .edit-field label{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:5px;
  }
  .edit-field .unit{ color:var(--text-dim); }
  .edit-subhead{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin:14px 0 8px;
  }
  .edit-warn{
    display:none;
    background:rgba(179,32,43,0.12);
    border:1px solid rgba(179,32,43,0.4);
    color:#ff8f8f;
    padding:8px 10px;
    border-radius:8px;
    font-size:12px;
    margin-bottom:10px;
  }
  .edit-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .btn-save{
    flex:1;
    background:linear-gradient(135deg, var(--red), #8a1620);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:10px;
    font-family:'Bebas Neue',sans-serif;
    font-size:17px;
    letter-spacing:.05em;
    cursor:pointer;
  }
  .btn-save:active{ transform:translateY(1px); }
  .btn-cancel{
    flex:1;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:12px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-cancel:hover{ color:var(--text); border-color:var(--text-dim); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Panel Pelatih · Basis Data Firebase</div>
  <h1>HASIL UJI FISIK</h1>
  <p>Cari dan tinjau hasil uji fisik atlet yang tersimpan secara realtime.</p>
</header>

<main>
  <div class="card">
    <div class="search-row">
      <input id="q-search" type="text" placeholder="Cari nama atlet…">
    </div>
    <div class="filters">
      <div class="field">
        <label>Jenis Kelamin</label>
        <select id="q-jk">
          <option value="">Semua</option>
          <option value="L">Laki-laki</option>
          <option value="P">Perempuan</option>
        </select>
      </div>
      <div class="field">
        <label>Kelompok Usia</label>
        <select id="q-usia">
          <option value="">Semua</option>
          <option value="6-8">6–8</option>
          <option value="9-11">9–11</option>
          <option value="12-14">12–14</option>
          <option value="15-17">15–17</option>
          <option value="18-25">18–25</option>
        </select>
      </div>
      <div class="field">
        <label>Kategori</label>
        <select id="q-cat">
          <option value="">Semua</option>
          <option value="0">Sangat Kurang</option>
          <option value="1">Kurang</option>
          <option value="2">Cukup</option>
          <option value="3">Baik</option>
          <option value="4">Baik Sekali</option>
        </select>
      </div>
    </div>
    <div id="sync-status" class="sync-note" style="margin-top:12px;">Menghubungkan ke Firebase…</div>
  </div>

  <div class="result-count" id="result-count"></div>
  <div id="list-wrap">
    <div class="roster-empty">Memuat data...</div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, set } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPI3JDgJCmTomJ8muev2ld39POwEdsVwk",
  authDomain: "tesp-529b8.firebaseapp.com",
  databaseURL: "https://tesp-529b8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tesp-529b8",
  storageBucket: "tesp-529b8.firebasestorage.app",
  messagingSenderId: "586985292162",
  appId: "1:586985292162:web:84a01d8724c25f98ef8f9b",
  measurementId: "G-XF0N4NFY0T"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const rosterRef = ref(db, 'uji_fisik');

const CATS = ["Sangat Kurang","Kurang","Cukup","Baik","Baik Sekali"];
const CAT_COLORS = ["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)"];

// ---------- Norma penilaian & logika klasifikasi (identik dengan inputtes.html) ----------
const NORMS = {
  situp: {
    '6-8':{L:[4,7,10,13],P:[3,6,9,12]},
    '9-11':{L:[6,9,13,17],P:[5,8,12,16]},
    '12-14':{L:[8,12,16,20],P:[7,11,15,19]},
    '15-17':{L:[9,13,18,23],P:[8,12,17,21]},
    '18-25':{L:[10,14,19,24],P:[9,13,17,22]}
  },
  pushup: {
    '6-8':{L:[2,5,8,12],P:[1,4,7,10]},
    '9-11':{L:[4,8,12,16],P:[3,7,11,14]},
    '12-14':{L:[8,12,16,20],P:[6,10,14,18]},
    '15-17':{L:[10,15,20,26],P:[8,13,18,23]},
    '18-25':{L:[12,17,23,30],P:[10,15,20,26]}
  },
  illinois: {
    '6-8':{L:[26.0,24.0,22.0,20.0],P:[27.0,25.0,23.0,21.0]},
    '9-11':{L:[23.5,22.0,20.5,19.0],P:[24.5,23.0,21.0,19.5]},
    '12-14':{L:[20.5,19.0,17.5,16.0],P:[21.5,20.0,18.0,16.5]},
    '15-17':{L:[19.5,18.0,16.5,15.0],P:[20.5,19.0,17.0,15.5]},
    '18-25':{L:[19.0,17.6,16.0,14.5],P:[20.0,18.6,17.0,15.5]}
  },
  sprint20: {
    '6-8':{L:[5.20,4.80,4.40,4.10],P:[5.40,5.00,4.60,4.25]},
    '9-11':{L:[4.60,4.30,3.95,3.65],P:[4.80,4.50,4.10,3.80]},
    '12-14':{L:[4.20,3.90,3.60,3.30],P:[4.40,4.10,3.75,3.45]},
    '15-17':{L:[4.05,3.78,3.50,3.25],P:[4.20,3.92,3.60,3.35]},
    '18-25':{L:[4.00,3.72,3.45,3.20],P:[4.10,3.82,3.55,3.30]}
  },
  bleep: {
    '6-8':{L:[3.5,4.5,5.5,6.5],P:[3.0,4.0,5.0,6.0]},
    '9-11':{L:[4.5,5.5,6.8,8.0],P:[4.0,5.0,6.3,7.5]},
    '12-14':{L:[5.0,6.5,8.0,9.5],P:[4.5,6.0,7.5,9.0]},
    '15-17':{L:[6.0,7.5,9.0,10.5],P:[5.5,7.0,8.5,10.0]},
    '18-25':{L:[6.5,8.0,9.5,11.0],P:[6.0,7.5,9.0,10.5]}
  },
  singleleg: {
    '6-8':{L:[4,8,15,25],P:[5,9,16,26]},
    '9-11':{L:[6,10,18,30],P:[7,11,19,32]},
    '12-14':{L:[8,15,25,40],P:[8,15,25,40]},
    '15-17':{L:[9,16,28,42],P:[9,16,28,42]},
    '18-25':{L:[10,18,30,45],P:[10,18,30,45]}
  }
};

const TEST_META = [
  {key:'situp', label:'Sit-up 30 Detik', unit:'kali', direction:'higher'},
  {key:'pushup', label:'Push-up Maksimal', unit:'kali', direction:'higher'},
  {key:'illinois', label:'Illinois Agility Test', unit:'detik', direction:'lower'},
  {key:'sprint20', label:'Sprint 20 Meter', unit:'detik', direction:'lower'},
  {key:'bleep', label:'Bleep Test', unit:'level', direction:'higher'},
  {key:'singleleg', label:'Single Leg Stance', unit:'detik', direction:'higher'}
];

const SABUK_TARGET = { Putih:5, Merah:10, Kuning:15, Biru:20, Coklat:25, Hitam:30, 'Hitam Strip I':35, 'Hitam Strip II':40 };

function getAgeGroup(age){
  if(age>=6 && age<=8) return '6-8';
  if(age>=9 && age<=11) return '9-11';
  if(age>=12 && age<=14) return '12-14';
  if(age>=15 && age<=17) return '15-17';
  if(age>=18 && age<=25) return '18-25';
  return null;
}

function classify(value, bounds, direction){
  if(direction==='higher'){
    if(value<=bounds[0]) return 0;
    if(value<=bounds[1]) return 1;
    if(value<=bounds[2]) return 2;
    if(value<=bounds[3]) return 3;
    return 4;
  } else {
    if(value>=bounds[0]) return 0;
    if(value>=bounds[1]) return 1;
    if(value>=bounds[2]) return 2;
    if(value>=bounds[3]) return 3;
    return 4;
  }
}

function findRow(rows, key){
  return (rows||[]).find(r=>r.key===key);
}

let allEntries = [];
let openId = null;
let editingId = null;

function setSyncStatus(msg, cls){
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-note' + (cls ? ' '+cls : '');
}

onValue(rosterRef, (snapshot) => {
  const data = snapshot.val() || {};
  allEntries = Object.keys(data).map(id => ({...data[id], id}));
  allEntries.sort((a,b)=> (b.tanggal||'').localeCompare(a.tanggal||''));
  setSyncStatus('Tersinkron dengan Firebase · ' + allEntries.length + ' atlet', 'ok');
  applyFilters();
}, (err) => {
  console.error(err);
  setSyncStatus('Gagal terhubung ke Firebase.', 'err');
});

function applyFilters(){
  const q = document.getElementById('q-search').value.trim().toLowerCase();
  const jk = document.getElementById('q-jk').value;
  const usia = document.getElementById('q-usia').value;
  const cat = document.getElementById('q-cat').value;

  const filtered = allEntries.filter(e=>{
    if(q && !(e.nama||'').toLowerCase().includes(q)) return false;
    if(jk && e.jk !== jk) return false;
    if(usia && e.ageGroup !== usia) return false;
    if(cat !== '' && String(e.overallIdx) !== cat) return false;
    return true;
  });

  document.getElementById('result-count').textContent =
    filtered.length + ' dari ' + allEntries.length + ' atlet ditemukan';

  renderList(filtered);
}

['input','change'].forEach(evt=>{
  document.getElementById('q-search').addEventListener(evt, applyFilters);
  document.getElementById('q-jk').addEventListener(evt, applyFilters);
  document.getElementById('q-usia').addEventListener(evt, applyFilters);
  document.getElementById('q-cat').addEventListener(evt, applyFilters);
});

function renderList(entries){
  const wrap = document.getElementById('list-wrap');
  if(entries.length===0){
    wrap.innerHTML = '<div class="roster-empty">Tidak ada atlet yang cocok dengan pencarian.</div>';
    return;
  }
  wrap.innerHTML = '';
  entries.forEach(e=>{
    const card = document.createElement('div');
    card.className = 'athlete-card';

    const badge = e.overallIdx!==null && e.overallIdx!==undefined
      ? `<span class="overall-badge" style="background:${CAT_COLORS[e.overallIdx]};color:#12151a;">${CATS[e.overallIdx].toUpperCase()}</span>`
      : `<span class="overall-badge" style="background:#2b303b;color:var(--text-dim);">BELUM ADA DATA</span>`;

    card.innerHTML = `
      <div class="athlete-top">
        <div>
          <div class="athlete-name">${e.nama}</div>
          <div class="athlete-meta">${e.usia} th · ${e.jk==='L'?'Laki-laki':'Perempuan'} · kelompok usia ${e.ageGroup||'-'} · ${e.tanggal||'-'}</div>
        </div>
        ${badge}
      </div>
      <div class="detail" id="detail-${e.id}"></div>
    `;

    
    // CARI BAGIAN INI DI FUNGSI renderList():
card.addEventListener('click', (ev) => {
  // Abaikan klik jika yang diklik adalah tombol hapus, tombol edit, ATAU elemen di dalam form/detail
  if (
    ev.target.closest('.del') || 
    ev.target.closest('.edit-btn') || 
    ev.target.closest('.detail')
  ) {
    return;
  }

  toggleDetail(e);
});

    wrap.appendChild(card);

    if(openId === e.id){
      if(editingId === e.id){
        renderEditForm(e);
      } else {
        renderDetail(e);
      }
    }
  });
}

function toggleDetail(e){
  if(openId === e.id){
    openId = null;
    editingId = null;
  } else {
    openId = e.id;
    editingId = null;
  }
  applyFilters();
}

function startEdit(e){
  openId = e.id;
  editingId = e.id;
  applyFilters();
}

function cancelEdit(){
  editingId = null;
  applyFilters();
}

function renderTestRow(row){
  if(!row.filled){
    return `
      <div class="test-row">
        <div class="test-row-top">
          <span class="tname">${row.label}</span>
          <span class="empty-note">tidak diisi</span>
        </div>
      </div>`;
  }
  let segs = '';
  for(let i=0;i<5;i++){
    segs += `<div class="seg${i<=row.catIdx?' on':''}" style="--seg-color:${CAT_COLORS[row.catIdx]}"></div>`;
  }
  return `
    <div class="test-row">
      <div class="test-row-top">
        <span class="tname">${row.label}</span>
        <span class="tval">${row.val} ${row.unit||''}</span>
      </div>
      <div class="gauge">${segs}</div>
      <div class="cat-label" style="color:${CAT_COLORS[row.catIdx]}">${CATS[row.catIdx]}</div>
    </div>`;
}

function renderDetail(e){
  const detail = document.getElementById('detail-'+e.id);
  if(!detail) return;
  detail.classList.add('open');

  const EXTRA_KEYS = ['hafalan','patahan'];
  const rows = e.rows||[];
  const physicalRows = rows.filter(r=>!EXTRA_KEYS.includes(r.key));
  const extraRows = rows.filter(r=>EXTRA_KEYS.includes(r.key));

  let html = '';
  physicalRows.forEach(row=>{ html += renderTestRow(row); });

  if(extraRows.length){
    html += `<div class="subhead">Tes Keagamaan &amp; Ketahanan</div>`;
    extraRows.forEach(row=>{ html += renderTestRow(row); });
  }

  html += `
    <div class="action-row">
      <button type="button" class="edit-btn" data-id="${e.id}">Edit Data</button>
      <button class="del" data-id="${e.id}">Hapus Data Atlet Ini</button>
    </div>`;
  detail.innerHTML = html;

  detail.querySelector('.edit-btn').addEventListener('click', (ev)=>{
    ev.stopPropagation();
    startEdit(e);
  });

  detail.querySelector('.del').addEventListener('click', async (ev)=>{
    ev.stopPropagation();
    if(!confirm('Hapus data atlet ' + e.nama + '?')) return;
    try{
      await remove(ref(db, 'uji_fisik/'+e.id));
    }catch(err){
      console.error(err);
      alert('Gagal menghapus data.');
    }
  });
}

function renderEditForm(e){
  const detail = document.getElementById('detail-'+e.id);
  if(!detail) return;
  detail.classList.add('open');

  const rows = e.rows||[];
  const hafalanRow = findRow(rows,'hafalan');
  const patahanRow = findRow(rows,'patahan');

  let sabukVal = '';
  if(hafalanRow && hafalanRow.filled){
    const m = (hafalanRow.label||'').match(/Sabuk\s+(.+)\)/);
    if(m) sabukVal = m[1];
  }
  const hafalVal = (hafalanRow && hafalanRow.filled) ? hafalanRow.val : '';
  const patahanVal = (patahanRow && patahanRow.filled)
    ? (patahanRow.val === 'Patah' ? 'ya' : 'tidak')
    : '';

  const id = e.id;

  let testFieldsHtml = '';
  TEST_META.forEach(t=>{
    const row = findRow(rows, t.key);
    const val = (row && row.filled) ? row.val : '';
    testFieldsHtml += `
      <div class="edit-field">
        <label>${t.label} <span class="unit">${t.unit}</span></label>
        <input id="edit-${t.key}-${id}" type="number" step="any" value="${val}" placeholder="kosongkan jika tidak diuji">
      </div>`;
  });

  detail.innerHTML = `
    <div class="edit-form">
      <div class="edit-field" style="margin-bottom:12px;">
        <label>Nama</label>
        <input id="edit-nama-${id}" type="text" value="${(e.nama||'').replace(/"/g,'&quot;')}">
      </div>
      <div class="edit-grid">
        <div class="edit-field">
          <label>Usia (tahun)</label>
          <input id="edit-usia-${id}" type="number" min="6" max="25" value="${e.usia!==undefined?e.usia:''}">
        </div>
        <div class="edit-field">
          <label>Jenis Kelamin</label>
          <select id="edit-jk-${id}">
            <option value="L" ${e.jk==='L'?'selected':''}>Laki-laki</option>
            <option value="P" ${e.jk==='P'?'selected':''}>Perempuan</option>
          </select>
        </div>
        <div class="edit-field">
          <label>Tanggal</label>
          <input id="edit-tanggal-${id}" type="date" value="${e.tanggal||''}">
        </div>
      </div>
      <div id="edit-warn-${id}" class="edit-warn">Norma penilaian hanya tersedia untuk usia 6–25 tahun. Kategori tidak dapat dihitung untuk usia ini.</div>

      <div class="edit-subhead">Hasil Tes</div>
      <div class="test-edit-grid">${testFieldsHtml}</div>

      <div class="edit-subhead">Tes Keagamaan &amp; Ketahanan</div>
      <div class="edit-grid" style="grid-template-columns:1fr 1fr;">
        <div class="edit-field">
          <label>Tingkatan Sabuk</label>
          <select id="edit-sabuk-${id}">
            <option value="">— pilih sabuk —</option>
            <option value="Putih" ${sabukVal==='Putih'?'selected':''}>Putih (target 5 surat)</option>
            <option value="Merah" ${sabukVal==='Merah'?'selected':''}>Merah (target 10 surat)</option>
            <option value="Kuning" ${sabukVal==='Kuning'?'selected':''}>Kuning (target 15 surat)</option>
            <option value="Biru" ${sabukVal==='Biru'?'selected':''}>Biru (target 20 surat)</option>
            <option value="Coklat" ${sabukVal==='Coklat'?'selected':''}>Coklat (target 25 surat)</option>
            <option value="Hitam" ${sabukVal==='Hitam'?'selected':''}>Hitam (target 30 surat)</option>
            <option value="Hitam Strip I" ${sabukVal==='Hitam Strip I'?'selected':''}>Hitam Strip I (target 35 surat)</option>
            <option value="Hitam Strip II" ${sabukVal==='Hitam Strip II'?'selected':''}>Hitam Strip II (target 40 surat)</option>
          </select>
        </div>
        <div class="edit-field">
          <label>Jumlah Surat Dihafal</label>
          <input id="edit-hafal-${id}" type="number" step="1" value="${hafalVal}">
        </div>
      </div>
      <div class="edit-field" style="margin-bottom:12px;">
        <label>Tes Patahan</label>
        <select id="edit-patahan-${id}">
          <option value="">— pilih hasil —</option>
          <option value="ya" ${patahanVal==='ya'?'selected':''}>Patah (memenuhi)</option>
          <option value="tidak" ${patahanVal==='tidak'?'selected':''}>Tidak Patah</option>
        </select>
      </div>

      <div class="edit-actions">
        <button type="button" class="btn-save" data-id="${id}">SIMPAN PERUBAHAN</button>
<button type="button" class="btn-cancel" data-id="${id}">Batal</button>
      </div>
    </div>
  `;

  const usiaInput = document.getElementById('edit-usia-'+id);
  const warnEl = document.getElementById('edit-warn-'+id);
  usiaInput.addEventListener('input', ()=>{
    const age = parseFloat(usiaInput.value);
    warnEl.style.display = (age && !getAgeGroup(age)) ? 'block' : 'none';
  });

  detail.querySelector('.btn-save').addEventListener('click', (ev)=>{
    ev.stopPropagation();
    saveEdit(id);
  });
  detail.querySelector('.btn-cancel').addEventListener('click', (ev)=>{
    ev.stopPropagation();
    cancelEdit();
  });
}

async function saveEdit(id){
  const nama = document.getElementById(`edit-nama-${id}`).value.trim() || 'Tanpa Nama';
  const usia = parseFloat(document.getElementById(`edit-usia-${id}`).value);
  const jk = document.getElementById(`edit-jk-${id}`).value;
  const tanggal = document.getElementById(`edit-tanggal-${id}`).value || new Date().toISOString().slice(0,10);
  const warnEl = document.getElementById(`edit-warn-${id}`);

  if(!usia){ alert('Isi usia atlet terlebih dahulu.'); return; }
  const ageGroup = getAgeGroup(usia);
  if(!ageGroup){
    warnEl.style.display = 'block';
    return;
  }
  warnEl.style.display = 'none';

  const rows = [];
  let catSum = 0, catCount = 0;

  TEST_META.forEach(t=>{
    const raw = document.getElementById(`edit-${t.key}-${id}`).value;
    if(raw===''){ rows.push({...t, filled:false}); return; }
    const val = parseFloat(raw);
    const bounds = NORMS[t.key][ageGroup][jk];
    const catIdx = classify(val, bounds, t.direction);
    catSum += catIdx; catCount++;
    rows.push({...t, filled:true, val, catIdx});
  });

  const sabuk = document.getElementById(`edit-sabuk-${id}`).value;
  const hafalRaw = document.getElementById(`edit-hafal-${id}`).value;
  if(sabuk && hafalRaw!==''){
    const hafal = parseFloat(hafalRaw);
    const target = SABUK_TARGET[sabuk];
    const memenuhi = hafal >= target;
    const catIdx = memenuhi ? 4 : 1;
    rows.push({key:'hafalan', label:`Hafalan (Sabuk ${sabuk})`, unit:'surat', filled:true, val:hafal, catIdx});
    catSum += catIdx; catCount++;
  } else {
    rows.push({key:'hafalan', label:'Hafalan', unit:'surat', filled:false});
  }

  const patahan = document.getElementById(`edit-patahan-${id}`).value;
  if(patahan){
    const catIdx = patahan==='ya' ? 4 : 1;
    rows.push({key:'patahan', label:'Tes Patahan', unit:'', filled:true, val:(patahan==='ya'?'Patah':'Tidak Patah'), catIdx});
    catSum += catIdx; catCount++;
  } else {
    rows.push({key:'patahan', label:'Tes Patahan', unit:'', filled:false});
  }

  const overallIdx = catCount ? Math.round(catSum/catCount) : null;
  const updated = {nama, usia, jk, tanggal, ageGroup, rows, overallIdx};

  try{
    await set(ref(db, 'uji_fisik/'+id), updated);
    editingId = null;
  }catch(err){
    console.error(err);
    alert('Gagal menyimpan perubahan.');
  }
}
</script>

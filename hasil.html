<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lihat Hasil Uji Fisik — Atlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --panel:#1b1f27;
    --panel-2:#20242e;
    --border:#2b303b;
    --text:#eee9df;
    --text-dim:#8d94a1;
    --red:#b3202b;
    --gold:#c9a24d;
    --c0:#d64545;
    --c1:#e08a3c;
    --c2:#d9b54a;
    --c3:#7fb069;
    --c4:#3f9463;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(179,32,43,0.15), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding-bottom:60px;
  }
  header{
    padding:36px 20px 24px;
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, rgba(201,162,77,0.04) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(38px,8vw,58px);
    letter-spacing:.03em;
    margin:0 0 6px;
    line-height:.95;
  }
  header p{ color:var(--text-dim); margin:0; max-width:480px; font-size:14px; }
  main{ max-width:820px; margin:0 auto; padding:24px 16px 0; }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
  }

  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }
  .search-row input[type="text"]{
    flex:1;
  }
  input, select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{ outline:none; border-color:var(--gold); }
  .filters{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  @media (max-width:560px){
    .filters{grid-template-columns:1fr 1fr;}
  }
  label{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.04em;
  }

  .sync-note{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .sync-note.ok{color:var(--c4);}
  .sync-note.err{color:var(--c0);}

  .result-count{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    margin:14px 2px 10px;
  }

  .athlete-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .athlete-card:hover{ border-color:var(--gold); }
  .athlete-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }
  .athlete-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;
    letter-spacing:.02em;
    line-height:1;
  }
  .athlete-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-top:6px;
  }
  .overall-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:6px 12px;
    border-radius:8px;
    font-weight:700;
    letter-spacing:.05em;
    white-space:nowrap;
    align-self:flex-start;
  }

  .detail{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--border);
  }
  .detail.open{ display:block; }
  .test-row{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    background:var(--panel-2);
  }
  .test-row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .test-row-top .tname{font-weight:600; font-size:13px;}
  .test-row-top .tval{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .gauge{ display:flex; gap:4px; }
  .gauge .seg{ flex:1; height:7px; border-radius:3px; background:#2b303b; }
  .gauge .seg.on{ background:var(--seg-color, var(--gold)); }
  .cat-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    margin-top:6px;
    letter-spacing:.04em;
    font-weight:600;
  }
  .empty-note{ color:var(--text-dim); font-size:12px; font-style:italic; }

  .subhead{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin:14px 0 8px;
    padding-top:10px;
    border-top:1px dashed var(--border);
  }

  .roster-empty{
    color:var(--text-dim);
    font-size:13px;
    padding:20px 0;
    text-align:center;
  }

  .athlete-actions{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .print-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    background:var(--panel-2);
    color:var(--gold);
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s ease, background .15s ease;
  }
  .print-btn:hover{ border-color:var(--gold); background:#262b35; }
  .print-btn:disabled{ opacity:.5; cursor:wait; }
  .cert-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    background:var(--panel-2);
    color:#e0b464;
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s ease, background .15s ease;
  }
  .cert-btn:hover{ border-color:#e0b464; background:#262b35; }
  .cert-btn:disabled{ opacity:.5; cursor:wait; }

  .modal-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,12,16,0.82);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    max-width:920px;
    width:100%;
    max-height:92vh;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .modal-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;
    letter-spacing:.02em;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .modal-close{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:22px;
    cursor:pointer;
    line-height:1;
  }
  .modal-img-wrap{
    overflow:auto;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0c0e12;
  }
  .modal-img-wrap img{ display:block; width:100%; height:auto; }
  .modal-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .modal-btn{
    flex:1;
    min-width:140px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    text-align:center;
  }
  .modal-btn.primary{ background:var(--red); border-color:var(--red); color:#fff; }
  .modal-loading{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    padding:40px 0;
  }

</style>
</head>
<body>

<header>
  <div class="eyebrow">YD ATHLETE</div>
  <h1>HASIL UJI FISIK</h1>
  <p>Cari dan lihat hasil uji fisik atlet yang tersimpan secara realtime.</p>
</header>

<main>
  <div class="card">
    <div class="search-row">
      <input id="q-search" type="text" placeholder="Cari nama atlet…">
    </div>
    <div class="filters">
      <div class="field">
        <label>Jenis Kelamin</label>
        <select id="q-jk">
          <option value="">Semua</option>
          <option value="L">Laki-laki</option>
          <option value="P">Perempuan</option>
        </select>
      </div>
      <div class="field">
        <label>Kelompok Usia</label>
        <select id="q-usia">
          <option value="">Semua</option>
          <option value="6-8">6–8</option>
          <option value="9-11">9–11</option>
          <option value="12-14">12–14</option>
          <option value="15-17">15–17</option>
          <option value="18-25">18–25</option>
        </select>
      </div>
      <div class="field">
        <label>Kategori</label>
        <select id="q-cat">
          <option value="">Semua</option>
          <option value="0">Sangat Kurang</option>
          <option value="1">Kurang</option>
          <option value="2">Cukup</option>
          <option value="3">Baik</option>
          <option value="4">Baik Sekali</option>
        </select>
      </div>
    </div>
    <div id="sync-status" class="sync-note" style="margin-top:12px;">Menghubungkan…</div>
  </div>

  <div class="result-count" id="result-count"></div>
  <div id="list-wrap">
    <div class="roster-empty">Memuat data...</div>
  </div>
</main>

<div class="modal-backdrop" id="cert-modal">
  <div class="modal-box">
    <div class="modal-title">
      <span id="cert-modal-name">Hasil Uji Fisik</span>
      <button class="modal-close" id="cert-modal-close">&times;</button>
    </div>
    <div class="modal-img-wrap" id="cert-img-wrap">
      <div class="modal-loading">Menyusun gambar hasil…</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn primary" id="cert-download-btn" disabled>⬇ Unduh PNG</button>
      <button class="modal-btn" id="cert-print-btn" disabled>🖨️ Cetak / PDF</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPI3JDgJCmTomJ8muev2ld39POwEdsVwk",
  authDomain: "tesp-529b8.firebaseapp.com",
  databaseURL: "https://tesp-529b8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tesp-529b8",
  storageBucket: "tesp-529b8.firebasestorage.app",

  appId: "1:586985292162:web:84a01d8724c25f98ef8f9b",
  measurementId: "G-XF0N4NFY0T"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const rosterRef = ref(db, 'uji_fisik');

const CATS = ["Sangat Kurang","Kurang","Cukup","Baik","Baik Sekali"];
const CAT_COLORS = ["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)"];

let allEntries = [];
let openId = null;

function setSyncStatus(msg, cls){
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-note' + (cls ? ' '+cls : '');
}

onValue(rosterRef, (snapshot) => {
  const data = snapshot.val() || {};
  allEntries = Object.keys(data).map(id => ({...data[id], id}));
  allEntries.sort((a,b)=> (b.tanggal||'').localeCompare(a.tanggal||''));
  setSyncStatus('Tersinkron dengan Firebase · ' + allEntries.length + ' atlet', 'ok');
  applyFilters();
}, (err) => {
  console.error(err);
  setSyncStatus('Gagal terhubung ke Firebase.', 'err');
});

function applyFilters(){
  const q = document.getElementById('q-search').value.trim().toLowerCase();
  const jk = document.getElementById('q-jk').value;
  const usia = document.getElementById('q-usia').value;
  const cat = document.getElementById('q-cat').value;

  const filtered = allEntries.filter(e=>{
    if(q && !(e.nama||'').toLowerCase().includes(q)) return false;
    if(jk && e.jk !== jk) return false;
    if(usia && e.ageGroup !== usia) return false;
    if(cat !== '' && String(e.overallIdx) !== cat) return false;
    return true;
  });

  document.getElementById('result-count').textContent =
    filtered.length + ' dari ' + allEntries.length + ' atlet ditemukan';

  renderList(filtered);
}

['input','change'].forEach(evt=>{
  document.getElementById('q-search').addEventListener(evt, applyFilters);
  document.getElementById('q-jk').addEventListener(evt, applyFilters);
  document.getElementById('q-usia').addEventListener(evt, applyFilters);
  document.getElementById('q-cat').addEventListener(evt, applyFilters);
});

function renderList(entries){
  const wrap = document.getElementById('list-wrap');
  if(entries.length===0){
    wrap.innerHTML = '<div class="roster-empty">Tidak ada atlet yang cocok dengan pencarian.</div>';
    return;
  }
  wrap.innerHTML = '';
  entries.forEach(e=>{
    const card = document.createElement('div');
    card.className = 'athlete-card';

    const badge = e.overallIdx!==null && e.overallIdx!==undefined
      ? `<span class="overall-badge" style="background:${CAT_COLORS[e.overallIdx]};color:#12151a;">${CATS[e.overallIdx].toUpperCase()}</span>`
      : `<span class="overall-badge" style="background:#2b303b;color:var(--text-dim);">BELUM ADA DATA</span>`;

    card.innerHTML = `
      <div class="athlete-top">
        <div>
          <div class="athlete-name">${e.nama}</div>
          <div class="athlete-meta">${e.usia} th · ${e.jk==='L'?'Laki-laki':'Perempuan'} · kelompok usia ${e.ageGroup||'-'} · ${e.tanggal||'-'}</div>
        </div>
        <div class="athlete-actions">
          ${badge}
          <button class="print-btn" data-id="${e.id}">🖨️ Cetak Hasil</button>
          <button class="cert-btn" data-id="${e.id}">🎓 Cetak Sertifikat</button>
        </div>
      </div>
      <div class="detail" id="detail-${e.id}"></div>
    `;

    card.addEventListener('click', ()=>{
      toggleDetail(e);
    });

    card.querySelector('.print-btn').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      openCertificateModal(e);
    });

    card.querySelector('.cert-btn').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      openSertifikatModal(e);
    });

    wrap.appendChild(card);

    if(openId === e.id){
      renderDetail(e);
    }
  });
}

function toggleDetail(e){
  openId = (openId === e.id) ? null : e.id;
  applyFilters();
}

function renderTestRow(row){
  if(!row.filled){
    return `
      <div class="test-row">
        <div class="test-row-top">
          <span class="tname">${row.label}</span>
          <span class="empty-note">tidak diisi</span>
        </div>
      </div>`;
  }
  let segs = '';
  for(let i=0;i<5;i++){
    segs += `<div class="seg${i<=row.catIdx?' on':''}" style="--seg-color:${CAT_COLORS[row.catIdx]}"></div>`;
  }
  return `
    <div class="test-row">
      <div class="test-row-top">
        <span class="tname">${row.label}</span>
        <span class="tval">${row.val} ${row.unit||''}</span>
      </div>
      <div class="gauge">${segs}</div>
      <div class="cat-label" style="color:${CAT_COLORS[row.catIdx]}">${CATS[row.catIdx]}</div>
    </div>`;
}

function renderDetail(e){
  const detail = document.getElementById('detail-'+e.id);
  if(!detail) return;
  detail.classList.add('open');

  const EXTRA_KEYS = ['hafalan','patahan'];
  const rows = e.rows||[];
  const physicalRows = rows.filter(r=>!EXTRA_KEYS.includes(r.key));
  const extraRows = rows.filter(r=>EXTRA_KEYS.includes(r.key));

  let html = '';
  physicalRows.forEach(row=>{ html += renderTestRow(row); });

  if(extraRows.length){
    html += `<div class="subhead">Tes Keagamaan &amp; Ketahanan</div>`;
    extraRows.forEach(row=>{ html += renderTestRow(row); });
  }

  detail.innerHTML = html;
}

const SERTIFIKAT_B64 = "data:image/png;base64," + SERTIFIKAT_B64_PARTS.join("");

const templateImg = new Image();
templateImg.src = TEMPLATE_B64;
function ensureTemplateLoaded(){
  if(templateImg.complete && templateImg.naturalWidth>0) return Promise.resolve();
  return new Promise((resolve)=>{ templateImg.onload = ()=>resolve(); });
}

const sertifikatTemplateImg = new Image();
sertifikatTemplateImg.src = SERTIFIKAT_B64;
function ensureSertifikatTemplateLoaded(){
  if(sertifikatTemplateImg.complete && sertifikatTemplateImg.naturalWidth>0) return Promise.resolve();
  return new Promise((resolve)=>{ sertifikatTemplateImg.onload = ()=>resolve(); });
}
async function ensureSertifikatFontLoaded(){
  try{
    await document.fonts.load('italic 700 74px "Playfair Display"');
    await document.fonts.ready;
  }catch(err){ /* fonts best-effort */ }
}
async function ensureFontsLoaded(){
  try{
    await Promise.all([
      document.fonts.load("700 56px 'Bebas Neue'"),
      document.fonts.load("500 22px 'Inter'"),
      document.fonts.load("700 20px 'JetBrains Mono'"),
      document.fonts.load("400 16px 'JetBrains Mono'")
    ]);
    await document.fonts.ready;
  }catch(err){ /* fonts best-effort */ }
}

async function buildCertificateCanvas(entry){
  await ensureFontsLoaded();
  await ensureTemplateLoaded();

  const canvas = document.createElement('canvas');
  canvas.width = 2000;
  canvas.height = 1414;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(templateImg, 0, 0, 2000, 1414);

  const zoneLeft = 220, zoneRight = 1880;
  const zoneWidth = zoneRight - zoneLeft;
  const centerX = zoneLeft + zoneWidth/2;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#b3202b';
  ctx.font = "700 58px 'Bebas Neue'";
  ctx.fillText('HASIL UJI FISIK ATLET', centerX, 425);

  ctx.font = "600 18px 'JetBrains Mono'";
  ctx.fillStyle = '#8a8f98';
  ctx.fillText('', centerX, 452);

  ctx.strokeStyle = '#c9a24d';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(centerX-260, 472); ctx.lineTo(centerX+260, 472); ctx.stroke();

  ctx.font = "700 50px 'Bebas Neue'";
  ctx.fillStyle = '#1b1f27';
  ctx.fillText((entry.nama||'-').toUpperCase(), centerX, 542);

  ctx.font = "500 21px 'Inter'";
  ctx.fillStyle = '#4a4f58';
  const metaLine = `${entry.usia||'-'} Tahun  ·  ${entry.jk==='L'?'Laki-laki':'Perempuan'}  ·  Kelompok Usia ${entry.ageGroup||'-'}`;
  ctx.fillText(metaLine, centerX, 578);

  const EXTRA_KEYS = ['hafalan','patahan'];
  const filledRows = (entry.rows||[]).filter(r=>r.filled);
  const physicalRows = filledRows.filter(r=>!EXTRA_KEYS.includes(r.key));
  const extraRows = filledRows.filter(r=>EXTRA_KEYS.includes(r.key));
  const orderedRows = [...physicalRows, ...extraRows];

  const zoneTop = 620, zoneBottom = 1170;
  const headH = 44;
  const footerH = 95;
  const availForRows = (zoneBottom - zoneTop) - headH - footerH;
  const rowH = orderedRows.length
    ? Math.max(28, Math.min(46, Math.floor(availForRows / orderedRows.length)))
    : 46;

  const colNoW = 70, colHasilW = 300, colKatW = 340;
  const colNo = zoneLeft;
  const colTes = colNo + colNoW;
  const colTesW = zoneWidth - colNoW - colHasilW - colKatW;
  const colHasil = colTes + colTesW;
  const colKat = colHasil + colHasilW;

  const tableTop = zoneTop;

  if(orderedRows.length === 0){
    ctx.font = "500 22px 'Inter'";
    ctx.fillStyle = '#8a8f98';
    ctx.textAlign = 'center';
    ctx.fillText('Belum ada hasil tes yang diisi untuk atlet ini.', centerX, tableTop + 60);
  } else {
    ctx.fillStyle = '#b3202b';
    ctx.fillRect(colNo, tableTop, zoneWidth, headH);
    ctx.fillStyle = '#ffffff';
    ctx.font = "700 18px 'JetBrains Mono'";
    ctx.textAlign = 'center';
    ctx.fillText('NO', colNo + colNoW/2, tableTop + headH/2 + 6);
    ctx.textAlign = 'left';
    ctx.fillText('JENIS TES', colTes + 16, tableTop + headH/2 + 6);
    ctx.textAlign = 'center';
    ctx.fillText('HASIL', colHasil + colHasilW/2, tableTop + headH/2 + 6);
    ctx.fillText('KATEGORI', colKat + colKatW/2, tableTop + headH/2 + 6);

    let y = tableTop + headH;
    const bodyFontSize = rowH >= 40 ? 20 : (rowH >= 34 ? 17 : 15);
    orderedRows.forEach((row, i)=>{
      ctx.fillStyle = i % 2 === 0 ? '#f7f4ee' : '#ffffff';
      ctx.fillRect(colNo, y, zoneWidth, rowH);
      ctx.strokeStyle = '#e2ded4';
      ctx.lineWidth = 1;
      ctx.strokeRect(colNo, y, zoneWidth, rowH);

      ctx.fillStyle = '#1b1f27';
      ctx.font = `500 ${bodyFontSize}px 'Inter'`;
      ctx.textAlign = 'center';
      ctx.fillText(String(i+1), colNo + colNoW/2, y + rowH/2 + 6);
      ctx.textAlign = 'left';
      ctx.fillText(row.label, colTes + 16, y + rowH/2 + 6);
      ctx.textAlign = 'center';
      ctx.fillText(`${row.val} ${row.unit||''}`.trim(), colHasil + colHasilW/2, y + rowH/2 + 6);

      const catColor = CAT_COLORS_HEX[row.catIdx] || '#999';
      const pillW = Math.min(180, colKatW - 30), pillH = Math.min(28, rowH - 10);
      ctx.fillStyle = catColor;
      ctx.fillRect(colKat + colKatW/2 - pillW/2, y + rowH/2 - pillH/2, pillW, pillH);
      ctx.fillStyle = '#12151a';
      ctx.font = `700 ${Math.max(12, bodyFontSize-4)}px 'JetBrains Mono'`;
      ctx.fillText((CATS[row.catIdx]||'-').toUpperCase(), colKat + colKatW/2, y + rowH/2 + 5);

      y += rowH;
    });

    ctx.strokeStyle = '#b3202b';
    ctx.lineWidth = 2;
    ctx.strokeRect(colNo, tableTop, zoneWidth, headH + orderedRows.length*rowH);

    if(entry.overallIdx !== undefined && entry.overallIdx !== null && CATS[entry.overallIdx]){
      ctx.textAlign = 'center';
      ctx.font = "700 26px 'JetBrains Mono'";
      ctx.fillStyle = CAT_COLORS_HEX[entry.overallIdx];
      ctx.fillText('KATEGORI KESELURUHAN: ' + CATS[entry.overallIdx].toUpperCase(), centerX, y + 44);
    }
  }

  ctx.font = "400 15px 'JetBrains Mono'";
  ctx.fillStyle = '#a3a3a3';
  ctx.textAlign = 'center';
  const printedAt = new Date().toLocaleString('id-ID', { dateStyle:'long', timeStyle:'short' });

  return canvas;
}

// Area kosong "Diberikan Kepada:" pada template sertifikat (koordinat piksel asli 2000x1414)
const SERTIFIKAT_NAME_AREA = { centerX: 1000, centerY: 620, maxWidth: 1300, baseFontSize: 74 };

async function buildSertifikatCanvas(entry){
  await ensureSertifikatFontLoaded();
  await ensureSertifikatTemplateLoaded();

  const canvas = document.createElement('canvas');
  canvas.width = sertifikatTemplateImg.naturalWidth || 2000;
  canvas.height = sertifikatTemplateImg.naturalHeight || 1414;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(sertifikatTemplateImg, 0, 0, canvas.width, canvas.height);

  const nama = entry.nama || '-';
  let fontSize = SERTIFIKAT_NAME_AREA.baseFontSize;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  do{
    ctx.font = `italic 700 ${fontSize}px "Playfair Display", serif`;
    const width = ctx.measureText(nama).width;
    if(width <= SERTIFIKAT_NAME_AREA.maxWidth) break;
    fontSize -= 2;
  } while(fontSize > 28);

  ctx.font = `italic 700 ${fontSize}px "Playfair Display", serif`;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText(nama, SERTIFIKAT_NAME_AREA.centerX, SERTIFIKAT_NAME_AREA.centerY);

  return canvas;
}

async function openSertifikatModal(entry){
  const modal = document.getElementById('cert-modal');
  const imgWrap = document.getElementById('cert-img-wrap');
  const nameEl = document.getElementById('cert-modal-name');
  const dlBtn = document.getElementById('cert-download-btn');
  const printBtn = document.getElementById('cert-print-btn');

  nameEl.textContent = 'Sertifikat Kelulusan — ' + (entry.nama||'-');
  imgWrap.innerHTML = '<div class="modal-loading">Menyusun sertifikat…</div>';
  dlBtn.disabled = true;
  printBtn.disabled = true;
  modal.classList.add('open');

  try{
    const canvas = await buildSertifikatCanvas(entry);
    const dataUrl = canvas.toDataURL('image/png');
    imgWrap.innerHTML = '';
    const img = document.createElement('img');
    img.src = dataUrl;
    imgWrap.appendChild(img);

    const safeName = (entry.nama||'atlet').trim().replace(/\s+/g,'_').replace(/[^\w\-]/g,'');
    dlBtn.disabled = false;
    printBtn.disabled = false;

    dlBtn.onclick = ()=>{
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'Sertifikat_' + (safeName || 'Atlet') + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    printBtn.onclick = ()=>{
      const w = window.open('', '_blank');
      if(!w) return;
      w.document.title = 'Cetak Sertifikat - ' + (entry.nama||'');
      const style = w.document.createElement('style');
      style.textContent = 'body{margin:0;}img{width:100%;display:block;}';
      w.document.head.appendChild(style);
      const printImg = w.document.createElement('img');
      printImg.src = dataUrl;
      printImg.onload = ()=>{ w.focus(); w.print(); };
      w.document.body.appendChild(printImg);
    };
  }catch(err){
    console.error(err);
    imgWrap.innerHTML = '<div class="modal-loading">Gagal menyusun sertifikat.</div>';
  }
}
